<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your Account | VJ Institute</title>
  <meta name="description" content="Create your account to start learning design, engineering architecture, and interactive masterclasses at VJ Institute.">
  <link rel="icon" type="image/svg+xml" href="assets/images/vj-institute-logo.svg">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-split-body">

  <!-- Top Navigation Helper Bar -->
  <header class="auth-top-bar">
    <a href="landing.html" class="back-home-link" title="Return to Landing Page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>
    <a href="index.html" class="auth-badge-sanctuary">
      <span>🏛️ Enter LMS Dashboard</span>
    </a>
  </header>

  <!-- Main Split Card Container -->
  <main class="auth-split-card">

    <!-- LEFT COLUMN: SIGNUP FORM -->
    <section class="auth-form-panel">
      
      <!-- Brand Logo -->
      <a href="landing.html" class="auth-brand-row">
        <div class="brand-icon-wrap">
          <img src="assets/images/vj-institute-logo.svg" alt="VJ Institute Logo" style="width: 32px; height: 32px; border-radius: 8px;">
        </div>
        <span class="brand-title-text">VJ Institute</span>
      </a>

      <!-- Headline -->
      <h1 class="auth-title">Create your Account</h1>
      <p class="auth-subtitle">Get started with your free account today:</p>

      <!-- Social Logins (Google & Facebook) -->
      <div class="social-buttons-row">
        <button type="button" class="btn-social" id="btn-social-google">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.93 6.72-4.93z"/>
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="btn-social" id="btn-social-facebook">
          <svg viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span>Facebook</span>
        </button>
      </div>

      <!-- Divider Line -->
      <div class="auth-divider">
        <span>or continue with email</span>
      </div>

      <!-- Alert Notification Banner -->
      <div class="auth-alert-box" id="auth-alert">
        <span id="alert-icon">⚠️</span>
        <span id="alert-text">Notification message</span>
      </div>

      <!-- Sign Up Form -->
      <form id="signup-form">
        <div class="form-inputs-stack">
          
          <!-- Full Name Input -->
          <div class="input-icon-field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="signup-name" 
              class="auth-input" 
              placeholder="Full Name" 
              required
              autocomplete="name"
              autofocus
            >
          </div>

          <!-- Email Input -->
          <div class="input-icon-field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input 
              type="email" 
              id="signup-email" 
              class="auth-input" 
              placeholder="Email" 
              required
              autocomplete="email"
            >
          </div>

          <!-- Password Input -->
          <div class="input-icon-field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="signup-password" 
              class="auth-input" 
              placeholder="Password (minimum 6 characters)" 
              required
              autocomplete="new-password"
            >
            <button type="button" class="toggle-pass-btn" id="toggle-password-btn" aria-label="Toggle password view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit" id="btn-submit-signup">
            <span>Submit</span>
          </button>

        </div>
      </form>

      <!-- Switch to Sign In -->
      <div class="auth-switch-text">
        Already have an account? <a href="login.html">Log in</a>
      </div>

    </section>

    <!-- RIGHT COLUMN: SOLID BLUE SHOWCASE PANEL -->
    <section class="auth-showcase-panel" aria-label="Dashboard Integration Showcase">
      
      <div style="height: 10px;"></div>

      <!-- Graphic Stage with Circles, Connected Badges and Mockup Card -->
      <div class="showcase-graphic-stage">
        
        <div class="glow-circle-outer"></div>
        <div class="glow-circle-inner"></div>

        <!-- Branching Connector Cables (SVG) -->
        <svg class="app-connectors-svg" viewBox="0 0 320 280" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 115 75 C 150 75, 170 140, 205 140" stroke="#0050d0" stroke-width="7" stroke-linecap="round"/>
          <path d="M 115 75 C 150 75, 170 140, 205 140" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
          
          <path d="M 80 140 L 205 140" stroke="#0050d0" stroke-width="7" stroke-linecap="round"/>
          <path d="M 80 140 L 205 140" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
          
          <path d="M 115 205 C 150 205, 170 140, 205 140" stroke="#0050d0" stroke-width="7" stroke-linecap="round"/>
          <path d="M 115 205 C 150 205, 170 140, 205 140" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
        </svg>

        <!-- Floating Badge 1: Slack (Top) -->
        <div class="floating-app-badge badge-slack">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M6 15a2 2 0 1 1-2-2h2v2zm1 0a2 2 0 1 1 2 2v-2H7zm0-3a2 2 0 1 1-2-2 2 2 0 0 1 2 2v0zm0-1a2 2 0 1 1 2-2v2H7z" fill="#E01E5A"/>
            <path d="M9 6a2 2 0 1 1 2-2v2H9zm0 1a2 2 0 1 1-2 2H9V7zm3 0a2 2 0 1 1 2-2 2 2 0 0 1-2 2v0zm1 0a2 2 0 1 1-2 2h2V7z" fill="#36C5F0"/>
            <path d="M18 9a2 2 0 1 1 2 2h-2V9zm-1 0a2 2 0 1 1-2-2v2h2zm0 3a2 2 0 1 1 2 2 2 2 0 0 1-2-2v0zm0 1a2 2 0 1 1-2 2v-2h2z" fill="#2EB67D"/>
            <path d="M15 18a2 2 0 1 1-2 2v-2h2zm0-1a2 2 0 1 1 2-2h-2v2zm-3 0a2 2 0 1 1-2 2 2 2 0 0 1 2-2v0zm-1 0a2 2 0 1 1 2-2h-2v2z" fill="#ECB22E"/>
          </svg>
        </div>

        <!-- Floating Badge 2: Gallery/Photo (Middle Left) -->
        <div class="floating-app-badge badge-gallery">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0062FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>

        <!-- Floating Badge 3: Google (Bottom Left) -->
        <div class="floating-app-badge badge-google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.93 6.72-4.93z"/>
          </svg>
        </div>

        <!-- Floating White Dashboard Tablet Mockup -->
        <div class="dashboard-mockup-card">
          <div class="mockup-header-dots">
            <span></span><span></span><span></span>
          </div>
          <div class="mockup-search-pill"></div>
          <div class="mockup-skeleton-lines">
            <div class="mockup-item-row">
              <span class="mockup-avatar-dot"></span>
              <span class="mockup-text-bar" style="width: 75%;"></span>
            </div>
            <div class="mockup-item-row">
              <span class="mockup-avatar-dot"></span>
              <span class="mockup-text-bar" style="width: 90%;"></span>
            </div>
            <div class="mockup-item-row">
              <span class="mockup-avatar-dot"></span>
              <span class="mockup-text-bar" style="width: 60%;"></span>
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom Headline, Subtitle & Pagination Dots -->
      <div class="showcase-text-block">
        <h3 class="showcase-headline">Complete your application</h3>
        <p class="showcase-subtext">Everything you need in an easily customizable dashboard</p>
        
        <div class="showcase-dots-row">
          <span class="showcase-dot"></span>
          <span class="showcase-dot active"></span>
          <span class="showcase-dot"></span>
        </div>
      </div>

    </section>

  </main>

  <script src="js/auth.js"></script>
  <script>
    (function() {
      const nameInput = document.getElementById('signup-name');
      const emailInput = document.getElementById('signup-email');
      const passInput = document.getElementById('signup-password');
      const submitBtn = document.getElementById('btn-submit-signup');
      const signupForm = document.getElementById('signup-form');
      const togglePassBtn = document.getElementById('toggle-password-btn');
      const alertBox = document.getElementById('auth-alert');
      const alertIcon = document.getElementById('alert-icon');
      const alertText = document.getElementById('alert-text');

      togglePassBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          togglePassBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          `;
        } else {
          passInput.type = 'password';
          togglePassBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          `;
        }
      });

      function showAlert(msg, isSuccess = false) {
        alertBox.className = 'auth-alert-box ' + (isSuccess ? 'success' : 'error');
        alertIcon.textContent = isSuccess ? '✅' : '⚠️';
        alertText.textContent = msg;
        alertBox.style.display = 'flex';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Social mock fills
      document.getElementById('btn-social-google').addEventListener('click', () => {
        nameInput.value = 'New Student';
        emailInput.value = 'student@example.com';
        passInput.value = 'password123';
        showAlert('Google SSO connected! Click Submit to complete registration.', true);
      });

      document.getElementById('btn-social-facebook').addEventListener('click', () => {
        nameInput.value = 'Creative Designer';
        emailInput.value = 'designer@example.com';
        passInput.value = 'password123';
        showAlert('Facebook SSO connected! Click Submit to complete registration.', true);
      });

      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlert();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const pass = passInput.value;

        if (pass.length < 6) {
          showAlert('Password must be at least 6 characters long.', false);
          passInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Creating account...</span>`;

        setTimeout(() => {
          const res = VJAuth.register({
            name: name,
            email: email,
            password: pass,
            role: 'Enrolled Designer',
            track: 'UI/UX Design & Architecture'
          });

          if (!res.success) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Submit</span>`;
            showAlert(res.error, false);
          } else {
            showAlert(`Account created successfully! Welcome, ${name}. Redirecting...`, true);
            submitBtn.innerHTML = `<span>Account Created ✓</span>`;
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 600);
          }
        }, 400);
      });

    })();
  </script>
</body>
</html>
